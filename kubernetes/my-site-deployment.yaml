apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-site
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-site
  template:
    metadata:
      labels:
        app: my-site
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-site-service
spec:
  selector:
    app: my-site
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
