<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой сайт</title>
</head>
<body>
    <h1>Это мой проект</h1>
    <p>Создан в пятницу, 24 апреля 2026.</p>
    <button onclick="loadFact()">Получить факт о DevOps</button>
    <p id="fact"></p>
    <script>
        async function loadFact() {
            const r = await fetch('/api/fact');
            const d = await r.json();
            document.getElementById('fact').textContent = d.fact;
        }
    </script>
</body>
</html>
