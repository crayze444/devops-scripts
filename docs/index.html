<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой сайт</title>
</head>
<body>
    <h1>Это мой проект - версия 2.0</h1>
    <p>Создан в пятницу, 24 апреля 2026.</p>
    <button onclick="showFact()">Получить факт о DevOps</button>
    <p id="fact"></p>
    <script>
        const facts = [
            "Docker выпущен в 2013 году.",
            "80% контейнеров в облаке — Docker.",
            "Nginx обрабатывает более 500 млн сайтов.",
            "CI/CD сокращает деплой с дней до минут.",
            "Первая система версий — SCCS, 1972 год."
        ];
        function showFact() {
            const f = facts[Math.floor(Math.random() * facts.length)];
            document.getElementById('fact').textContent = f;
        }
    </script>
</body>
</html>
